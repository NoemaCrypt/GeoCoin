[package]
name = "geocoin-loadnet-stress"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Isolated GeoCoin loadnet cluster, transaction load and health analyzer"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
