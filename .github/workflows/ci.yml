name: GeoCoin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    env:
      VCPKG_COMMIT: 3855d4d6b52353ee2e2f73044327e59d01a18c84
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Check patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_REF" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            git diff --check "origin/$BASE_REF...HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

      - name: Bootstrap Ubuntu dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/bootstrap-ubuntu-22.04.sh
          ./scripts/bootstrap-ubuntu-22.04.sh --with-gui

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -ne $env:VCPKG_COMMIT) { throw "VCPKG_COMMIT must match vcpkg.json builtin-baseline" }
          git clone --no-checkout https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" checkout --detach "$env:VCPKG_COMMIT"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat"
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_FEATURE_FLAGS=manifests,binarycaching" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure GeoCoin Linux Debug GUI
        if: runner.os == 'Linux'
        shell: bash
        run: cmake --preset linux-debug-gui -S .

      - name: Build GeoCoin Linux Debug GUI
        if: runner.os == 'Linux'
        shell: bash
        run: cmake --build out/build/linux-debug-gui --parallel

      - name: Run Linux ctest
        if: runner.os == 'Linux'
        shell: bash
        run: ctest --test-dir out/build/linux-debug-gui --output-on-failure

      - name: Configure libgeo Linux Release
        if: runner.os == 'Linux'
        shell: bash
        run: cmake --preset linux-release -S libgeo

      - name: Build libgeo Linux Release
        if: runner.os == 'Linux'
        shell: bash
        run: cmake --build libgeo/out/build/linux-release --parallel

      - name: Configure GeoCoin Windows Static Release GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --preset windows-clang-static-release-gui -S . -D BUILD_TESTS=ON

      - name: Build GeoCoin Windows Static Release GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build out\\build\\windows-clang-static-release-gui --config Release --parallel

      - name: Run Windows ctest
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir out/build/windows-clang-static-release-gui --output-on-failure -C Release

      - name: Configure libgeo Windows Static Release
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --preset windows-clang-static-release -S libgeo

      - name: Build libgeo Windows Static Release
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build libgeo\\out\\build\\windows-clang-static-release --config Release --parallel

  sanitizer:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Bootstrap Ubuntu dependencies
        shell: bash
        run: |
          chmod +x scripts/bootstrap-ubuntu-22.04.sh
          ./scripts/bootstrap-ubuntu-22.04.sh

      - name: Configure ASan and UBSan
        shell: bash
        run: >-
          cmake -S . -B out/build/linux-sanitized -G Ninja
          -D CMAKE_BUILD_TYPE=Debug
          -D BUILD_TESTS=ON
          -D BUILD_QT_GUI=OFF
          -D GEOCOIN_SANITIZER=address-undefined

      - name: Build ASan and UBSan
        shell: bash
        run: cmake --build out/build/linux-sanitized --parallel

      - name: Run ASan and UBSan tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir out/build/linux-sanitized --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Bootstrap dependencies
        run: bash scripts/bootstrap-ubuntu-22.04.sh
      - name: Configure ThreadSanitizer
        run: >-
          cmake -S . -B out/build/linux-tsan -G Ninja
          -D CMAKE_BUILD_TYPE=Debug -D BUILD_TESTS=ON -D BUILD_QT_GUI=OFF
          -D GEOCOIN_SANITIZER=thread
      - name: Build concurrency tests
        run: >-
          cmake --build out/build/linux-tsan --parallel 4
          --target test_wallet_concurrency test_mempool_units test_sync_manager_units
      - name: Run ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          # Fix the address layout only for this process tree so TSan can
          # reserve its shadow memory on kernels with wider ASLR ranges.
          setarch x86_64 -R ctest --test-dir out/build/linux-tsan --output-on-failure --timeout 180 \
            -R '^test_(wallet_concurrency|mempool_units|sync_manager_units)$'
