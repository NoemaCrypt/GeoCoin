name: Linux container builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-and-build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:20.04
          - ubuntu:21.10
          - ubuntu:22.04
          - ubuntu:22.10
          - ubuntu:23.04
          - ubuntu:23.10
          - ubuntu:24.04
          - ubuntu:24.10
          - ubuntu:25.04
          - ubuntu:25.10
          - ubuntu:26.04
          - debian:12
          - debian:13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Bootstrap and build geocoin-node
        run: bash scripts/container-build-matrix.sh --image "${{ matrix.image }}"
